# tg-torrent-bot — docker compose service.
#
# Usage on the Pi (or any host):
#   1. Build the image first:  docker build -t tg-torrent-bot:latest .
#      (or on a dev machine:   docker build --platform linux/arm64 -t tg-torrent-bot:latest .)
#   2. Copy .env.example to .env and fill it in.
#   3. docker compose up -d
#
# Portainer: paste this file as a Stack. Portainer stacks don't build images,
# so the image must already exist on the host (step 1) — that's why there is
# no `build:` key here. Environment variables can be supplied either by
# uploading the .env file or through Portainer's environment-variables UI.

services:
  tg-torrent-bot:
    image: tg-torrent-bot:latest
    container_name: tg-torrent-bot
    env_file:
      - .env
    volumes:
      # SQLite database (subscriptions, seen releases, downloads) — must
      # persist across restarts/updates. Matches the default DB_PATH=/data/bot.db.
      - ./data:/data
    restart: unless-stopped
    # Umbrel's shared app network — lets the bot reach prowlarr_server_1:9696
    # and transmission_server_1:9091 by container name, bypassing the app
    # proxy that fronts their published host ports.
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
