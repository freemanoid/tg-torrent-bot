name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds both platforms, pushes nothing

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: digest summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in the umbrel-app-store compose file." >> "$GITHUB_STEP_SUMMARY"
