name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: verify arm64 build
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./cmd/bot
