# tg-torrent-bot — docker compose service for plain (non-Umbrel) hosts.
#
#   docker compose up -d
#   open http://localhost:8542 and fill in the settings form
#
# With no configuration the bot starts in setup mode and serves only the
# settings page; saving writes /data/config.json and restarts to apply.
#
# On Umbrel, install the app from the community app store instead — it wires
# the settings page behind Umbrel's authenticating app proxy:
# https://github.com/freemanoid/umbrel-app-store
#
# Prefer configuring by environment instead of the form? Add an `env_file:
# [.env]` line below (see .env.example); a saved settings file takes precedence.

services:
  tg-torrent-bot:
    image: ghcr.io/freemanoid/tg-torrent-bot:latest
    container_name: tg-torrent-bot
    ports:
      # Settings page. Bind to 127.0.0.1 — it has no authentication of its own,
      # so never expose it directly to an untrusted network.
      - "127.0.0.1:8542:8542"
    volumes:
      # Settings file and SQLite database (subscriptions, seen releases,
      # downloads) — must persist across restarts and updates.
      - ./data:/data
    restart: unless-stopped
